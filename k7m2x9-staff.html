<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4EC">
<title>お品書き｜スタッフ用</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sumi:#0C0A08;
  --sumi-70:rgba(12,10,8,.82);
  --sumi-45:rgba(12,10,8,.62);
  --washi:#F7F4EC;
  --washi-2:#FFFDF8;
  --keisen:#D6CFBE;
  --shu:#A8352A;
  --shu-soft:rgba(168,53,42,.10);
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --gothic:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--washi);
  color:var(--sumi);
  font-family:var(--gothic);
  font-size:16px;
  line-height:1.6;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--shu);outline-offset:2px}

/* ---------- 見出し ---------- */
.app-head{
  padding:18px 20px 10px;
  background:var(--washi);
  border-bottom:1px solid var(--keisen);
}
.head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.shop{font-family:var(--mincho);font-weight:700;font-size:25px;letter-spacing:.16em;line-height:1.1}
.shop small{display:block;font-family:var(--gothic);font-weight:400;font-size:10px;letter-spacing:.34em;color:var(--sumi-45);margin-top:7px}
.head-right{display:flex;align-items:center;gap:9px}
.callbtn{
  font-family:var(--mincho);font-size:12.5px;letter-spacing:.12em;
  border:1px solid var(--shu);color:var(--shu);background:var(--shu-soft);
  padding:6px 11px;white-space:nowrap;
}
.callbtn[disabled]{border-color:var(--keisen);color:var(--sumi-45);background:none}
.gsheet{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:14px 0 8px}
.gsheet button{border:1px solid var(--sumi);background:var(--washi-2);padding:16px 0;font-family:var(--mincho);font-size:19px}
.gsheet button:active{background:var(--sumi);color:var(--washi)}
.seat b{cursor:pointer}
.callgrid{display:grid;gap:10px;padding:14px 0 6px}
.callgrid button{
  border:1px solid var(--sumi);padding:15px;text-align:left;
  font-family:var(--mincho);font-size:16px;letter-spacing:.08em;background:var(--washi-2);
}
.callgrid button small{display:block;font-family:var(--gothic);font-size:11px;letter-spacing:.04em;color:var(--sumi-45);margin-top:3px}
.callgrid button:active{background:var(--sumi);color:var(--washi)}
.callgrid button:active small{color:rgba(247,244,236,.7)}
.call-note{font-size:11.5px;color:var(--sumi-45);letter-spacing:.04em;padding-bottom:6px}
.seat{
  font-family:var(--mincho);font-weight:700;font-size:12.5px;letter-spacing:.1em;
  border:2px solid var(--shu);color:var(--shu);background:var(--shu-soft);
  padding:5px 10px;white-space:nowrap;
}
.seat b{font-size:20px;letter-spacing:.04em}

/* ---------- タブ ---------- */
.tabs-wrap{position:sticky;top:0;z-index:20;background:var(--washi)}
.tabs-wrap::after{content:"";position:absolute;top:0;right:0;bottom:1px;width:34px;pointer-events:none;background:linear-gradient(90deg,rgba(247,244,236,0),var(--washi) 70%)}
.tabs{
  position:relative;
  background:var(--washi);
  border-bottom:1px solid var(--keisen);
  overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tabs-inner{display:flex;gap:2px;padding:0 12px}
.tab{
  font-family:var(--mincho);font-weight:700;font-size:16.5px;letter-spacing:.06em;
  white-space:nowrap;padding:13px 11px 11px;color:var(--sumi-45);
  border-bottom:2px solid transparent;
}
.tab[aria-selected="true"]{color:var(--sumi);border-bottom-color:var(--sumi)}

/* ---------- 品書き ---------- */
main{padding:0 0 128px}
.sec-head{padding:26px 20px 6px}
.sec-title{font-family:var(--mincho);font-weight:700;font-size:21px;letter-spacing:.1em;display:flex;align-items:center;gap:10px}
.sec-title::before{content:"";width:13px;height:13px;border-radius:50%;background:var(--sumi);flex:none}
.sec-note{font-size:13px;font-weight:500;color:var(--sumi-45);letter-spacing:.06em;margin:5px 0 0 23px}

.list{list-style:none;margin:0;padding:0 20px}
.item{border-bottom:1px solid var(--keisen);padding:14px 0 13px}
.item:first-child{border-top:1px solid var(--sumi)}
.item-main{display:flex;align-items:baseline;gap:10px}
.item-name{font-family:var(--mincho);font-weight:700;font-size:19.5px;letter-spacing:.03em;flex:1;min-width:0}
.item-price{font-family:var(--mincho);font-weight:700;font-size:18px;letter-spacing:.02em;white-space:nowrap}
.item-sub{font-size:13px;font-weight:500;color:var(--sumi-45);letter-spacing:.04em;margin-top:3px}
.flag{
  display:inline-block;font-size:9.5px;letter-spacing:.14em;font-weight:500;
  border:1px solid var(--sumi-45);padding:1px 5px;margin-left:7px;vertical-align:2px;color:var(--sumi-70);
}
.flag.rare{border-color:var(--shu);color:var(--shu)}

.item.off .item-name,.item.off .item-price{color:var(--sumi-45)}
.item.off .item-name{text-decoration:line-through;text-decoration-thickness:1px}
.soldout{
  display:inline-block;font-size:9.5px;letter-spacing:.14em;
  border:1px solid var(--shu);color:var(--shu);padding:1px 5px;margin-left:7px;vertical-align:2px;
}
.qty{
  display:inline-flex;align-items:center;gap:6px;margin-left:8px;
  border:1px solid var(--shu);background:var(--shu-soft);color:var(--shu);
  padding:3px 4px 3px 10px;border-radius:999px;
  font-family:var(--mincho);font-size:13px;letter-spacing:.06em;
}
.qty button{width:26px;height:24px;font-size:16px;line-height:1;color:var(--shu);border-left:1px solid rgba(168,53,42,.35)}
.acts{flex-wrap:wrap;row-gap:8px}
.past-l button{border:1px solid var(--keisen);font-size:11px;letter-spacing:.08em;padding:2px 9px;margin-left:9px;color:var(--shu)}
.acts .none{font-size:12.5px;letter-spacing:.08em;color:var(--sumi-45);padding:7px 0}
.freeyen{
  width:104px;font-family:var(--mincho);font-size:16px;text-align:right;
  border:1px solid var(--sumi);background:var(--washi-2);padding:7px 9px;
}
.stk-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.stk-row label{font-size:11.5px;letter-spacing:.06em;color:var(--sumi-45)}
.stk{
  width:76px;font-family:var(--mincho);font-size:16px;text-align:center;
  border:1px solid var(--sumi);background:var(--washi-2);padding:6px 4px;
}
.stock{
  font-family:var(--mincho);font-size:13px;letter-spacing:.1em;
  border:1px dashed var(--sumi-45);color:var(--sumi-70);padding:6px 14px;
}
.stock.back{border-style:solid;border-color:var(--shu);color:var(--shu)}
.staffbar{
  position:sticky;top:0;z-index:25;display:none;
  background:var(--shu);color:var(--washi);
  padding:9px 18px;align-items:center;justify-content:space-between;gap:10px;
  font-size:12.5px;letter-spacing:.08em;
}
.staffbar.on{display:flex}
.staffbar{flex-wrap:wrap;row-gap:6px}
.takubar{
  position:sticky;top:0;z-index:24;display:none;
  background:var(--washi-2);border-bottom:1px solid var(--keisen);
  padding:9px 12px;gap:7px;overflow-x:auto;scrollbar-width:none;
}
.takubar.on{display:flex}
.takubar::-webkit-scrollbar{display:none}
.takubar .lbl{font-size:14px;font-weight:700;color:var(--sumi-45);align-self:center;white-space:nowrap;padding-right:4px}
.takubar button{
  font-family:var(--mincho);font-weight:700;font-size:20px;
  border:1px solid var(--keisen);padding:8px 16px;white-space:nowrap;color:var(--sumi-70);
}
.takubar button.on{background:var(--shu);color:#fff;border-color:var(--shu)}
.takubar{background:var(--shu-soft);border-bottom:1.5px solid var(--shu)}
.takubar .lbl{color:var(--shu);font-weight:700}
.staffbar button{border:1px solid rgba(247,244,236,.7);padding:5px 12px;font-size:12px;letter-spacing:.1em;white-space:nowrap}
.acts{display:flex;align-items:center;gap:8px;margin-top:10px}
.add{
  font-family:var(--mincho);font-weight:700;font-size:15.5px;letter-spacing:.12em;
  border:1px solid var(--sumi);padding:7px 20px;background:var(--washi-2);
  transition:background .15s ease,color .15s ease;
}
.add:active{background:var(--sumi);color:var(--washi)}
.add.taste{padding:7px 0;flex:1;text-align:center}
.count{
  margin-left:auto;font-family:var(--mincho);font-size:12.5px;letter-spacing:.06em;
  color:var(--shu);background:var(--shu-soft);padding:4px 10px;border-radius:999px;
  opacity:0;transform:translateY(2px);transition:opacity .18s ease,transform .18s ease;
}
.count.on{opacity:1;transform:none}

/* ---------- 会計バー ---------- */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--sumi);color:var(--washi);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:14px;
  transform:translateY(102%);transition:transform .26s cubic-bezier(.22,.7,.3,1);
}
.bar.on{transform:none}
.bar-sum{flex:1;min-width:0}
.bar-lbl{font-size:10.5px;letter-spacing:.24em;color:rgba(247,244,236,.6)}
.bar-yen{font-family:var(--mincho);font-weight:700;font-size:25px;letter-spacing:.02em;line-height:1.25}
.bar-btn{
  font-family:var(--mincho);font-weight:700;font-size:17px;letter-spacing:.16em;
  background:var(--washi);color:var(--sumi);padding:12px 22px;
}

/* ---------- 注文票 ---------- */
.veil{position:fixed;inset:0;z-index:40;background:rgba(21,18,15,.5);opacity:0;pointer-events:none;transition:opacity .24s ease}
.veil.on{opacity:1;pointer-events:auto}
.slip{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  max-height:88vh;display:flex;flex-direction:column;
  background:var(--washi-2);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.22,.7,.3,1);
}
.slip.on{transform:none}
.slip::before{
  content:"";display:block;height:9px;flex:none;
  background:repeating-linear-gradient(-45deg,var(--sumi) 0 12px,transparent 12px 24px);
  opacity:.85;
}
.slip-head{padding:16px 20px 10px;border-bottom:1px solid var(--sumi);display:flex;align-items:center;justify-content:space-between}
.slip-title{font-family:var(--mincho);font-weight:700;font-size:19px;letter-spacing:.2em}
.slip-close{font-size:13px;letter-spacing:.1em;color:var(--sumi-45)}
.slip-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 20px 20px}

.line{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px dashed var(--keisen)}
.line-name{flex:1;min-width:0;font-family:var(--mincho);font-weight:700;font-size:17.5px;letter-spacing:.02em}
.line-name em{font-style:normal;font-family:var(--gothic);font-size:11px;color:var(--shu);letter-spacing:.1em;margin-left:6px}
.line-yen{font-family:var(--mincho);font-weight:700;font-size:16.5px;width:74px;text-align:right}
.step{display:flex;align-items:center;border:1px solid var(--keisen)}
.step button{width:32px;height:30px;font-size:17px;line-height:1;color:var(--sumi-70)}
.step span{width:26px;text-align:center;font-family:var(--mincho);font-size:15px}

.sub{display:flex;justify-content:space-between;font-size:15px;font-weight:500;color:var(--sumi-70);padding:5px 0}
.sub:first-of-type{padding-top:14px}
.tot{display:flex;align-items:baseline;justify-content:space-between;padding:16px 0 4px;border-top:1px solid var(--sumi);margin-top:4px}
.tot-l{font-family:var(--mincho);font-size:16px;letter-spacing:.16em}
.tot-r{font-family:var(--mincho);font-size:27px}
.tot-note{font-size:12.5px;font-weight:500;color:var(--sumi-45);text-align:right;letter-spacing:.05em}
.send{
  width:100%;margin-top:16px;background:var(--sumi);color:var(--washi);
  font-family:var(--mincho);font-size:17px;letter-spacing:.22em;padding:16px;
}
.send[disabled]{opacity:.3}
.empty{text-align:center;padding:46px 0 40px;color:var(--sumi-45);font-family:var(--mincho);letter-spacing:.08em}

.past{margin-top:26px;padding-top:16px;border-top:1px solid var(--keisen)}
.past-h{font-family:var(--mincho);font-size:13px;letter-spacing:.18em;color:var(--sumi-45);margin-bottom:8px}
.past-l{display:flex;justify-content:space-between;font-size:15px;font-weight:500;color:var(--sumi-70);padding:3px 0}
.call{width:100%;margin-top:12px;border:1px solid var(--sumi);padding:12px;font-family:var(--mincho);letter-spacing:.16em;font-size:14px}

/* ---------- 判子 ---------- */
.stamp{
  position:fixed;inset:0;z-index:60;display:none;place-items:center;
  background:rgba(247,244,236,.9);
}
.stamp.on{display:grid}
.seal{
  width:132px;height:132px;border:5px solid var(--shu);border-radius:12px;
  display:grid;place-items:center;color:var(--shu);
  font-family:var(--mincho);font-weight:700;font-size:44px;letter-spacing:.1em;
  writing-mode:vertical-rl;line-height:1.05;padding:8px;
  transform:scale(1.7) rotate(-12deg);opacity:0;
  animation:press .5s cubic-bezier(.2,.9,.3,1) forwards;
}
.stamp-msg{position:absolute;bottom:34%;font-family:var(--mincho);letter-spacing:.2em;font-size:14px;opacity:0;animation:fade .4s .35s forwards}
@keyframes press{to{transform:scale(1) rotate(-9deg);opacity:.92}}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .seal{opacity:.92;transform:rotate(-9deg)}
  .stamp-msg{opacity:1}
}
.fadein{animation:up .28s ease both}
@keyframes up{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ---------- 全卓の注文 ---------- */
.board{position:fixed;inset:0;z-index:35;display:none;flex-direction:column;background:var(--washi)}
.board.on{display:flex}
.board-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px 10px;border-bottom:1px solid var(--sumi)}
.board-title{font-family:var(--mincho);font-weight:700;font-size:20px;letter-spacing:.16em}
.board-sum{flex:1;font-size:13px;font-weight:500;color:var(--sumi-70);letter-spacing:.04em}
.board-body{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 14px calc(24px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-content:start;
}
.tcard{background:var(--washi-2);border:1px solid var(--keisen);display:flex;flex-direction:column;min-width:0}
.tcard.is-open{border-color:var(--sumi)}
.tcard.is-call{border:2px solid var(--shu)}
.tcard-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:10px 12px 8px;border-bottom:1px solid var(--keisen)}
.tcard-no{font-family:var(--mincho);font-size:13px;letter-spacing:.1em;white-space:nowrap}
.tcard-no b{font-size:28px;letter-spacing:.02em;margin-left:3px}
.tcard-state{font-size:13px;font-weight:700;color:var(--sumi-70);text-align:right}
.tcard:not(.is-open) .tcard-state{color:var(--sumi-45);font-weight:500}
.tcard-call{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--shu);color:#fff;font-size:13px;font-weight:700;letter-spacing:.06em;padding:6px 12px}
.tcard-call.bill{background:var(--sumi)}
.tcard-call button{border:1px solid rgba(255,255,255,.75);font-size:12px;padding:3px 9px;white-space:nowrap}
.tcard-items{list-style:none;margin:0;padding:6px 12px;flex:1}
.tcard-items li{display:flex;justify-content:space-between;gap:8px;font-family:var(--mincho);font-size:15px;padding:4px 0;border-bottom:1px dashed var(--keisen)}
.tcard-items li:last-child{border-bottom:none}
.tcard-items .wait{font-family:var(--gothic);font-size:10.5px;font-weight:700;color:var(--shu);border:1px solid var(--shu);padding:0 4px;margin-left:6px;white-space:nowrap;vertical-align:2px}
.tcard-items .yen{color:var(--sumi-70);white-space:nowrap}
.tcard-empty{flex:1;padding:18px 12px;text-align:center;color:var(--sumi-45);font-family:var(--mincho);font-size:14px}
.tcard-foot{display:flex;justify-content:space-between;align-items:baseline;padding:8px 12px;border-top:1px solid var(--sumi)}
.tcard-foot span{font-size:12px;color:var(--sumi-45)}
.tcard-foot b{font-family:var(--mincho);font-size:22px}
.tcard-acts{display:flex;gap:6px;padding:0 12px 12px}
.tcard:not(.is-open) .tcard-acts{padding-top:12px}
.tcard-acts button{flex:1;border:1px solid var(--sumi);padding:9px 0;font-family:var(--mincho);font-size:14px;letter-spacing:.08em}
.tcard-acts button.main{background:var(--sumi);color:var(--washi)}

.sales-h{font-family:var(--mincho);font-weight:700;font-size:15px;letter-spacing:.18em;text-align:center;margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--sumi)}
.sales-h:first-child{margin-top:4px}
.sales-r{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;border-bottom:1px dashed var(--keisen)}
.sales-r.big{font-family:var(--mincho);font-size:19px;font-weight:700;border-bottom:none;padding-top:10px}
.sales-r em{font-style:normal;color:var(--sumi-45);font-size:12px;margin-left:8px}
.sales-note{font-size:12px;color:var(--sumi-45);line-height:1.8;margin-top:10px}

/* ---------- 呼び出し・音 ---------- */
.callstrip{display:none;position:sticky;top:0;z-index:26;background:var(--shu);color:#fff}
.callstrip.on{display:block}
.board .callstrip{position:static}
.cs-item{display:flex;align-items:center;gap:10px;padding:8px 18px;border-bottom:1px solid rgba(255,255,255,.25);font-size:14px;font-weight:700;letter-spacing:.04em}
.cs-item.bill{background:var(--sumi)}
.cs-item b{font-family:var(--mincho);font-size:20px}
.cs-item time{font-weight:400;opacity:.85;margin-left:auto}
.cs-item button{border:1px solid rgba(255,255,255,.8);padding:5px 12px;font-size:12.5px;white-space:nowrap}
.soundwarn{
  display:none;position:fixed;left:0;right:0;top:0;z-index:39;pointer-events:none;   /* 重ねて出す：消えても画面がずれない */
  background:var(--sumi);color:var(--washi);font-size:13px;padding:calc(8px + env(safe-area-inset-top)) 18px 8px;letter-spacing:.04em;
}
.soundwarn.on{display:block}
.guestnums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:6px 0 4px}
.guestnums button{border:1px solid var(--sumi);background:var(--washi-2);padding:12px 0;font-family:var(--mincho);font-weight:700;font-size:19px}
.guestnums button[aria-pressed="true"]{background:var(--sumi);color:var(--washi)}
.call[disabled]{opacity:.45}
.slip-info{font-size:13px;font-weight:500;color:var(--sumi-70);letter-spacing:.04em;padding:12px 0 4px}

/* ============ 印刷（お会計伝票） ============ */
#printArea{display:none}
@media print{
  body > *{display:none !important}
  #printArea{display:block !important;padding:0;margin:0}
  @page{margin:8mm}
}
.rcpt{font-family:var(--mincho);color:#000;font-size:13px;line-height:1.7;max-width:72mm}
.rcpt h1{font-size:17px;letter-spacing:.2em;text-align:center;margin:0 0 2px}
.rcpt .meta{text-align:center;font-size:11px;letter-spacing:.06em;margin-bottom:10px}
.rcpt hr{border:none;border-top:1px solid #000;margin:6px 0}
.rcpt .r{display:flex;justify-content:space-between;gap:8px}
.rcpt .r span:first-child{flex:1;min-width:0}
.rcpt .big{font-size:19px;font-weight:700;padding-top:4px}
.rcpt .foot{text-align:center;font-size:10.5px;margin-top:12px;letter-spacing:.08em}
</style>

let staff = STAFF_APP;   // スタッフ用URLなら最初からスタッフ用
const soldOut = new Set();   // 手動で提供終了にした品
const stock = new Map();     // 本日の在庫数（未設定＝無制限）
const stockDefault = new Map();      // 開店時の基本数量


async function saveDefault(){
  const n = stock.size;
  if (!await ask(`いまの在庫数（${n}件）を基本数量として上書きします。以後「開店リセット」でこの数に戻ります。`)) return;
  stockDefault.clear();
  stock.forEach((v,k) => stockDefault.set(k,v));
  if (ONLINE){
    db.collection('state').doc('stockDefault')
      .set({counts:Object.fromEntries(stockDefault)})
      .catch(err => console.error('基本数量の保存に失敗', err));
  }
  update();
  showStamp('基', '基本数量を更新しました');
}

async function resetStock(){
  if (!stockDefault.size){ showStamp('？', '先に基本数量を保存してください'); return; }
  if (!await ask('在庫を基本数量に戻し、提供終了もすべて解除します。')) return;
  stock.clear();
  stockDefault.forEach((v,k) => stock.set(k,v));
  soldOut.clear();
  saveStock();
  update();
  showStamp('開', '本日の在庫を用意しました');
}

function saveStock(){
  if (!ONLINE) return;
  db.collection('state').doc('stock')
    .set({counts:Object.fromEntries(stock), soldOut:[...soldOut]})
    .catch(err => console.error('在庫の保存に失敗', err));
}
/* 共通在庫（素材）の名前。セットと単品で1つの台数を分け合う */
const POOL_LABEL = {sunazuri:'砂ズリ（共通）', torimomo:'鳥もも（共通）', basashi:'馬刺し（共通）'};
const POOL_DEFAULT = {sunazuri:6, torimomo:5, basashi:5};   // 共通素材の基本数量
const USES = {};
MENU.forEach(c => c.items.forEach((it, i) => { if (it.uses) USES[`${c.id}-${i}`] = it.uses; }));
/* コードに書いた基本数量を読み込む（Firebaseに保存があればそちらが優先） */
(function initDefaults(){
  Object.entries(POOL_DEFAULT).forEach(([k,v]) => stockDefault.set(k, v));
  MENU.forEach(c => c.items.forEach((it,i) => {
    if (it.def != null && !it.uses) stockDefault.set(`${c.id}-${i}`, it.def);
  }));
  stockDefault.forEach((v,k) => stock.set(k, v));   // 初回はそのまま在庫に入れる
})();

function usesOf(key){ return USES[key] || {[key]:1}; }              // 何をいくつ使うか
function reserved(sk){                                              // 注文票で押さえている分
  return cart.reduce((s,l) => s + (usesOf(l.base)[sk] || 0) * l.qty, 0);
}
function poolLeft(sk){ return stock.has(sk) ? Math.max(0, stock.get(sk) - reserved(sk)) : Infinity; }
function remaining(key){
  const u = usesOf(key);
  return Math.min(...Object.entries(u).map(([sk,n]) =>
    poolLeft(sk) === Infinity ? Infinity : Math.floor(poolLeft(sk) / n)));
}
function isOut(key){ return soldOut.has(key) || remaining(key) <= 0; }
let cart = [];      // {key, name, taste, price, qty}
let ordered = [];   // {name, taste, qty}

const yen = n => '¥' + n.toLocaleString('ja-JP');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);

/* タブ */
function visibleCats(){ return MENU.filter(c => !c.staffOnly || staff); }

  if (!visibleCats().some(c => c.id === current)) current = MENU[0].id;
  $('tabsInner').innerHTML = visibleCats().map(c =>
    `<button class="tab" role="tab" data-cat="${c.id}" aria-selected="${c.id===current}">${c.label}</button>`
  ).join('');
}
renderTabs();
$('tabsInner').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  current = b.dataset.cat;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.cat === current));
  b.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
  renderMenu(true);
  window.scrollTo({top:0, behavior:'instant'});
});

/* 品書き */
function renderMenu(animate){
  const c = MENU.find(x => x.id === current);
  const fx = animate ? ' fadein' : '';
  $('main').innerHTML = `
    <div class="sec-head${fx}">
      <h2 class="sec-title">${c.label}</h2>
      ${c.note ? `<p class="sec-note">${c.note}</p>` : ''}
    </div>
    <ul class="list${fx}">${c.items.map((it,i) => row(c,it,i)).join('')}</ul>`;
  syncCounts();
}
function row(c, it, i){
  const key = `${c.id}-${i}`;
  const out = isOut(key);
  const flag = (it.f ? `<span class="flag${it.rare?' rare':''}">${it.f}</span>` : '')
             + (out ? '<span class="soldout">本日終了</span>' : '');

  // 注文ボタン（品切れ時は表示しない）
  const choices = it.opts || (it.t ? ['タレ','塩'] : null);
  if (it.free){
    return `<li class="item">
      <div class="item-main">
        <div class="item-name">${esc(it.n)}</div>
        <div class="item-price">－</div>
      </div>
      ${it.s ? `<div class="item-sub">${esc(it.s)}</div>` : ''}
      <div class="acts">
        <input class="freeyen" id="free-${key}" type="number" inputmode="numeric" min="0" placeholder="金額">
        <button class="add" data-free="${key}" data-i="${i}" data-cat="${c.id}">＋ 追加</button>
        ${cart.filter(l => l.base === key).map(l => `
          <span class="qty">${l.price < 0 ? '−¥' + Math.abs(l.price) : '¥' + l.price} ${l.qty}<button class="minus" data-k="${l.key}" aria-label="1つ減らす">−</button></span>`).join('')}
      </div>
    </li>`;
  }
  const acts = out
    ? `<div class="acts"><span class="none">申し訳ありません、本日分は終了しました</span></div>`
    : `<div class="acts">${
        choices
          ? choices.map(o => `<button class="add taste" data-cat="${c.id}" data-i="${i}" data-taste="${o}">${o}</button>`).join('')
          : `<button class="add" data-cat="${c.id}" data-i="${i}">＋ 追加</button>`
      }${cart.filter(l => l.base === key).map(l => `
        <span class="qty">${l.taste ? l.taste + ' ' : ''}${l.qty}<button class="minus" data-k="${l.key}" aria-label="1つ減らす">−</button></span>`).join('')}</div>`;

  // スタッフ用では在庫の操作欄も一緒に出す
  const stkRow = staff ? Object.keys(usesOf(key)).map(sk => {
    const v = stock.has(sk) ? stock.get(sk) : '';
    return `<div class="stk-row">
      <label for="stk-${sk}-${key}">${POOL_LABEL[sk] || '本日の在庫'}${stockDefault.has(sk) ? `（基本 ${stockDefault.get(sk)}）` : ''}</label>
      <input class="stk" id="stk-${sk}-${key}" type="number" inputmode="numeric" min="0" placeholder="無制限" value="${v}" data-key="${sk}">
    </div>`;
  }).join('') + `
    <div class="stk-row">
      <button class="stock${soldOut.has(key) ? ' back' : ''}" data-key="${key}">${soldOut.has(key) ? '販売を再開する' : '提供終了にする'}</button>
    </div>` : '';

  return `<li class="item${out ? ' off' : ''}">
    <div class="item-main">
      <div class="item-name">${esc(it.n)}${flag}</div>

const TAX = 0.10;
function subtotal(){ return cart.reduce((s,l) => s + l.price * l.qty, 0); }        // 今回の注文（税抜）
function orderedSub(){ return ordered.reduce((s,o) => s + (o.price || 0) * o.qty, 0); }
function billSub(){ return subtotal() + orderedSub(); }                            // 卓の累計（税抜）
function payable(n){ return Math.floor(n * (1 + TAX) / 10) * 10; }                 // 税込・10円未満切り捨て
function syncCounts(){

}
function update(){

  $('barYen').textContent = yen(payable(billSub()));

async function cancelLine(idx){
  const o = ordered[idx];
  if (!o) return;

  if (ONLINE && o._doc != null){
    try{
      const ref = db.collection('orders').doc(o._doc);
      const snap = await ref.get();
      const items = (snap.data().items || []).map(x => ({...x}));
      if (items[o._i]) items[o._i].qty--;
      const rest = items.filter(x => x.qty > 0);
      await ref.set({items:rest, open: rest.length > 0}, {merge:true});
      if (o.base){
        Object.entries(usesOf(o.base)).forEach(([sk,n]) => { if (stock.has(sk)) stock.set(sk, stock.get(sk) + n); });
        saveStock();
      }
    }catch(err){ console.error('取消に失敗', err); }
    return;
  }

  o.qty--;
  if (o.base) Object.entries(usesOf(o.base)).forEach(([sk,n]) => { if (stock.has(sk)) stock.set(sk, stock.get(sk) + n); });
  if (o.qty <= 0) ordered.splice(idx, 1);
  update();
  renderSlip();
}

let sending = false;
async function sendOrder(){
  if (!cart.length || sending) return;
  const items = cart.map(l => ({name:l.name, taste:l.taste, base:l.base, price:l.price, qty:l.qty}));

  if (!ONLINE){
    items.forEach(it => {
      Object.entries(usesOf(it.base)).forEach(([sk,n]) => {
        if (stock.has(sk)) stock.set(sk, Math.max(0, stock.get(sk) - n * it.qty));
      });
      const hit = ordered.find(o => o.name === it.name && o.taste === it.taste);
      if (hit) hit.qty += it.qty; else ordered.push({...it});
    });
    cart = [];
    closeSlip();
    showStamp('承', 'ご注文を承りました');
    setTimeout(update, 1500);
    return;
  }

  const table = TABLE;
  let session = openSessionOf(table);
  if (!session){
    const n = await askGuests(table);
    if (!n){ openSlip(); return; }
    try{ session = await openTable(table, n); }
    catch(err){
      console.error('入店に失敗', err);
      showStamp('×', '入店できませんでした');
      openSlip();
      return;
    }
    if (TABLE !== table) return;
  }

  sending = true;
  renderSlip();
  try{
    await placeOrder(table, session, items);
    cart = [];
    closeSlip();
    showStamp('承', 'ご注文を承りました');
    setTimeout(update, 1500);
  }catch(err){
    console.error('注文に失敗', err);
    showStamp('×', err && err.message === 'CLOSED' ? '会計済みの卓です。入店からやり直してください' : '送信できませんでした');
  }finally{
    sending = false;
    update();
  }
}

/* 注文と在庫を1回の取引で書く。会計済みの卓には書かない */
function placeOrder(table, session, items){
  const tRef = db.collection('tables').doc(table);
  const sRef = db.collection('state').doc('stock');
  const oRef = db.collection('orders').doc();
  return db.runTransaction(async tx => {
    const t = (await tx.get(tRef)).data() || {};
    if (t.status !== 'open' || t.session !== session) throw new Error('CLOSED');
    const v = (await tx.get(sRef)).data() || {};
    const counts = {...(v.counts || {})};
    items.forEach(it => Object.entries(usesOf(it.base)).forEach(([sk,n]) => {
      if (counts[sk] != null) counts[sk] = Math.max(0, counts[sk] - n * it.qty);
    }));
    tx.set(oRef, {
      table, session, items,
      open: true, done: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      at: Date.now()
    });
    tx.set(sRef, {counts, soldOut: v.soldOut || []}, {merge:true});
  });
}

const OTOSHI = {name:'お通し キャベツ', price:100};   // お一人様・税抜

function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function openSessionOf(t){
  const v = tablesState.get(String(t));
  return v && v.status === 'open' && v.session ? v.session : null;
}
function otoshiItem(n){ return {name:OTOSHI.name, taste:'', base:'otoshi', price:OTOSHI.price, qty:n}; }

/* 卓が空いていれば来店を作ってお通しを計上。すでに入店中ならその来店IDを返す */
async function openTable(table, n){
  const t = String(table);
  const tRef = db.collection('tables').doc(t);
  const oRef = db.collection('orders').doc();
  const res = await db.runTransaction(async tx => {
    const v = (await tx.get(tRef)).data() || {};
    if (v.status === 'open' && v.session) return {session:v.session, joined:true, guests:v.guests || 0};
    const session = newId();
    const now = Date.now();
    tx.set(tRef, {table:t, status:'open', session, guests:n, openedAt:now, closedAt:null});
    tx.set(oRef, {
      table: t, session, items: [otoshiItem(n)],
      open: true, done: false, otoshi: true,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      at: now
    });
    return {session, joined:false};
  });
  tablesState.set(t, {...(tablesState.get(t) || {}), status:'open', session:res.session,
                      guests: res.joined ? res.guests : n});
  showStamp('入', res.joined ? `卓${t} はすでに${res.guests}名様で入店中です` : `卓${t} ${n}名様 入店`);
  return res.session;
}

let soundOn = true;
let audioCtx = null;
const BOOTED = Date.now();

const TONE = {
  order: {times:2, a:880,  b:1320},   // 注文：ピピッ ×2
  call:  {times:3, a:880,  b:1320},   // 店員呼び出し：×3
  bill:  {times:4, a:1175, b:784}     // お会計：高→低 ×4（聞き分け用）
};
function beep(tone){
  if (!soundOn) return;
  tone = tone || TONE.order;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    for (let i = 0; i < tone.times; i++){
      const t = audioCtx.currentTime + i * 0.48;
      const osc = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const osc3 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const comp = audioCtx.createDynamicsCompressor();   // 歪ませずに音圧を稼ぐ
      comp.threshold.setValueAtTime(-18, t);
      comp.ratio.setValueAtTime(12, t);
      osc.type = 'square';
      osc2.type = 'square';
      osc3.type = 'sawtooth';
      osc.frequency.setValueAtTime(tone.a, t);
      osc.frequency.setValueAtTime(tone.b, t + 0.12);
      osc2.frequency.setValueAtTime(tone.a * 2, t);
      osc2.frequency.setValueAtTime(tone.b * 2, t + 0.12);
      osc3.frequency.setValueAtTime(tone.a / 2, t);
      osc3.frequency.setValueAtTime(tone.b / 2, t + 0.12);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(3.0, t + 0.01);   // 最大音量
      gain.gain.setValueAtTime(3.0, t + 0.30);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);
      osc.connect(gain); osc2.connect(gain); osc3.connect(gain);
      gain.connect(comp).connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.40);
      osc2.start(t); osc2.stop(t + 0.40);
      osc3.start(t); osc3.stop(t + 0.40);
    }
  }catch(err){ console.error('音を出せません', err); }
}

/* ===== 売上集計 ===== */
const DAY_START_HOUR = 6;      // 営業日の区切り（朝6時。深夜の会計は前日の売上に入れる）

function dayStart(now){
  const d = new Date(now || Date.now());
  if (d.getHours() < DAY_START_HOUR) d.setDate(d.getDate() - 1);
  d.setHours(DAY_START_HOUR, 0, 0, 0);
  return d;
}
const ymd = d => `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;

/* 締めた卓を1件ずつにまとめ、0円の会計は外す */
async function collectSales(){
  const from = dayStart();
  const snap = await db.collection('orders').where('closedAt','>=',from.getTime()).get();
  const groups = {};
  snap.forEach(d => {
    const o = d.data();
    if (o.open !== false) return;
    const g = `${o.table}-${Math.floor((o.closedAt || 0) / 60000)}`;
    groups[g] = groups[g] || {table:String(o.table), closedAt:o.closedAt || 0, sub:0, guests:0};
    (o.items || []).forEach(it => {
      groups[g].sub += (it.price || 0) * it.qty;
      if (it.base === 'otoshi') groups[g].guests += it.qty;
    });
  });

  const all = Object.values(groups).sort((a, b) => a.closedAt - b.closedAt);
  const bills = all.filter(g => payable(g.sub) !== 0);     // 0円の会計は売上に入れない
  const zero = all.length - bills.length;

  let sub = 0, total = 0, guests = 0;
  bills.forEach(g => {
    sub += g.sub;
    total += payable(g.sub);
    guests += g.guests;
  });
  return {from, bills, zero, sub, total, guests, at:new Date()};
}

function tableSum(rows){
  return rows.reduce((s, o) => s + (o.items || []).reduce((a, it) => a + (it.price || 0) * it.qty, 0), 0);
}
function renderBoard(){

    $('boardSum').textContent = '';

    return;
  }
  const now = Date.now();
  let busy = 0, total = 0;
  const known = new Set([...TABLES, ...openRows.map(o => String(o.table))]);
  const list = [...known].sort(tableOrder);

  $('boardBody').innerHTML = list.map(t => {
    const ts = tablesState.get(t) || {};
    const rows = openRows.filter(o => String(o.table) === t);
    const isOpen = ts.status === 'open' || rows.length > 0;
    const calls = activeCalls.filter(c => String(c.table) === t);

    // 同じ品をまとめる（未提供の数も数える）
    const agg = [];
    rows.slice().sort((a, b) => (a.at || 0) - (b.at || 0)).forEach(o => (o.items || []).forEach(it => {
      const key = `${it.name}|${it.taste || ''}|${it.price || 0}`;
      let x = agg.find(y => y.key === key);
      if (!x){ x = {key, name:it.name, taste:it.taste, price:it.price || 0, qty:0, wait:0}; agg.push(x); }
      x.qty += it.qty;
      if (!o.done) x.wait += it.qty;
    }));
    const sum = payable(tableSum(rows));
    if (isOpen){ busy++; total += sum; }

    let state = '空席';
    if (ts.status === 'open'){
      const min = ts.openedAt ? Math.max(0, Math.floor((now - ts.openedAt) / 60000)) : null;
      state = `${ts.guests || '?'}名${min != null ? `・${min}分` : ''}`;
    } else if (rows.length){
      state = '利用中';
    } else if (ts.status === 'closed' && ts.closedAt && now - ts.closedAt < 3 * 3600e3){
      state = `会計済み ${hhmm(new Date(ts.closedAt))}`;
    }

    const callHtml = calls.map(c => `
      <div class="tcard-call${callKind(c) === 'bill' ? ' bill' : ''}">

      </div>`).join('');

    const body = agg.length
      ? `<ul class="tcard-items">${agg.map(x => `
          <li><span>${esc(x.name)}${x.taste ? '・' + esc(x.taste) : ''}　${x.qty}${x.wait ? `<span class="wait">未提供 ${x.wait}</span>` : ''}</span>
          <span class="yen">${yen(x.price * x.qty)}</span></li>`).join('')}</ul>
         <div class="tcard-foot"><span>税込</span><b>${yen(sum)}</b></div>`
      : (isOpen ? '<div class="tcard-empty">注文はまだありません</div>' : '');

    const acts = isOpen
      ? `<button data-pick="${esc(t)}">この卓を操作</button><button class="main" data-settle="${esc(t)}">会計する</button>`
      : `<button data-pick="${esc(t)}">この卓を操作</button><button class="main" data-enter="${esc(t)}">入店</button>`;

    return `<article class="tcard${isOpen ? ' is-open' : ''}${calls.length ? ' is-call' : ''}">
      <header class="tcard-head"><div class="tcard-no">卓<b>${esc(t)}</b></div><div class="tcard-state">${state}</div></header>

  $('boardSum').textContent = `利用中 ${busy}卓　未会計 計 ${yen(total)}（税込）`;

/* 卓の並び順：1〜7 → A・B・C */
function tableOrder(x, y){
  const nx = /^\d+$/.test(x), ny = /^\d+$/.test(y);
  if (nx && ny) return (+x) - (+y);
  if (nx) return -1;
  if (ny) return 1;
  return String(x).localeCompare(String(y), 'ja');
}

/* ===================== 印刷（ePOS-Print） ===================== */
const COLS = PRINTER.cols;

const xq = v => String(v).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));

/* 全角は2文字ぶんとして桁を数える */
function cw(v){
  let n = 0;
  for (const ch of String(v)){
    const u = ch.codePointAt(0);
    n += (u < 0x80 || (u >= 0xFF61 && u <= 0xFF9F)) ? 1 : 2;
  }
  return n;
}
/* 桁数で折り返す */
function wrap(v, cols){
  const out = [];
  let line = '', n = 0;
  for (const ch of String(v)){
    const u = ch.codePointAt(0);
    const w = (u < 0x80 || (u >= 0xFF61 && u <= 0xFF9F)) ? 1 : 2;
    if (n + w > cols){ out.push(line); line = ''; n = 0; }
    line += ch; n += w;
  }
  if (line) out.push(line);
  return out;
}
function clip(v, max){
  let out = '', n = 0;
  for (const ch of String(v)){
    const u = ch.codePointAt(0);
    const w = (u < 0x80 || (u >= 0xFF61 && u <= 0xFF9F)) ? 1 : 2;
    if (n + w > max) return out;
    out += ch; n += w;
  }
  return out;
}
/* 左寄せと右寄せを1行に収める */
function lr(left, right, cols){
  const c = cols || COLS;
  const l = clip(left, Math.max(0, c - cw(right) - 1));
  return l + ' '.repeat(Math.max(1, c - cw(l) - cw(right))) + right;
}
const T   = v => `<text>${xq(v)}&#10;</text>`;
const BIG = v => `<text width="2" height="2">${xq(v)}&#10;</text><text width="1" height="1"/>`;
const RULE = (c) => T((c || '-').repeat(COLS));

/* プリンターへ送る。成功しなければ例外 */
async function eposSend(body){
  const xml = '<?xml version="1.0" encoding="utf-8"?>' +
    '<s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/"><s:Body>' +
    '<epos-print xmlns="http://www.epson-pos.com/schemas/2011/03/epos-print">' +
    body + '</epos-print></s:Body></s:Envelope>';
  const url = `${PRINTER.host}/cgi-bin/epos/service.cgi?devid=${PRINTER.devid}&timeout=${PRINTER.timeout}`;
  const res = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'text/xml; charset=utf-8'},
    body: xml
  });
  const txt = await res.text();
  if (!/success="true"/.test(txt)) throw new Error(txt.slice(0, 300));
  return txt;
}

const HUGE  = v => `<text width="3" height="3">${xq(v)}&#10;</text><text width="1" height="1"/>`;
const GIANT = v => `<text width="4" height="4">${xq(v)}&#10;</text><text width="1" height="1"/>`;   // 厨房票の卓番

/* 厨房・ホール用の注文票 */
/* ドリンクの判定。カテゴリで分け、裏メニューは品名で拾う */
const DRINK_CATS  = ['beer','sake','chuhai','soft','bottle'];
const DRINK_WORDS = ['炭酸水', '焼酎のセット'];
function isDrink(it){
  const cat = String(it.base || '').split('-')[0];
  if (DRINK_CATS.includes(cat)) return true;
  return DRINK_WORDS.some(w => (it.name || '').includes(w));
}

/* 1件の注文を、ドリンク票とフード票に分ける。片方だけならその1枚 */
function ticketsOf(o){
  const items = o.items || [];
  const drink = items.filter(isDrink);
  const food  = items.filter(it => !isDrink(it));
  const out = [];
  if (drink.length) out.push({label:'ド リ ン ク', xml:ticketXml(o, drink, 'ド リ ン ク')});
  if (food.length)  out.push({label:'フ ー ド',   xml:ticketXml(o, food,  'フ ー ド')});
  return out;
}

function ticketXml(o, items, label){
  const d = o.at ? new Date(o.at) : new Date();
  const hm = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  let b = '<text lang="ja" smooth="true"/><text align="center"/>';
  b += GIANT(`卓 ${o.table}`);
  b += BIG(label || '');
  b += T(hm);
  b += '<text align="left"/>' + RULE('=');
  const half = Math.floor(COLS / 2);
  (items || o.items || []).forEach(it => {
    const nm = it.name + (it.taste ? '・' + it.taste : '');
    const q  = '　' + it.qty;                     // 全角スペース1つ＋数量
    let ls = wrap(nm, half);
    if (cw(ls[ls.length - 1]) + cw(q) > half) ls = wrap(nm, half - cw(q));   // 数量が行からはみ出すときだけ詰めて折り返す
    ls[ls.length - 1] += q;
    ls.forEach(l => { b += BIG(l); });
  });
  b += RULE('=');
  b += '<feed line="1"/><cut type="feed"/>';
  return b;
}

/* 自動印刷の担当を取る。複数の端末が同じ票を出さないようにする */
async function claimPrint(ref){
  try{
    return await db.runTransaction(async tx => {
      const s = await tx.get(ref);
      if (!s.exists || s.data().printed) return false;
      tx.set(ref, {printed:true}, {merge:true});
      return true;
    });
  }catch(err){
    console.error('印刷の確保に失敗（そのまま印刷します）', err);
    return true;
  }
}
async function autoPrint(ref, xml, label){
  if (!await claimPrint(ref)) return;
  try{
    for (const x of [].concat(xml)) await eposSend(x);
  }catch(err){
    console.error(`${label}の印刷に失敗`, err);
    showStamp('×', `${label}を印刷できません`);
    ref.set({printed:false}, {merge:true}).catch(() => {});
  }
}

/* 注文票を1枚出す。二重印刷を避けるため印刷済みを記録する */
async function printTicket(o){
  try{
    for (const t of ticketsOf(o)) await eposSend(t.xml);
    if (ONLINE && o.id) db.collection('orders').doc(o.id).set({printed:true}, {merge:true});
  }catch(err){
    console.error('注文票の印刷に失敗', err);
    showStamp('×', '注文票を印刷できません');
  }
}

async function printTest(){
  try{
    await eposSend('<text lang="ja" smooth="true"/><text align="center"/>' +
      BIG('印刷テスト') + T(new Date().toLocaleString('ja-JP')) +
      '<feed line="2"/><cut type="feed"/>');
    showStamp('印', 'プリンターは正常です');
  }catch(err){
    console.error(err);
    showStamp('×', 'プリンターに繋がりません');
  }
}

function printBill(table){
  const rows = openRows.filter(o => String(o.table) === String(table));
  const items = [];
  rows.forEach(o => (o.items||[]).forEach(it => {
    const hit = items.find(x => x.name === it.name && x.taste === it.taste);
    if (hit) hit.qty += it.qty; else items.push({...it});
  }));
  const sub = items.reduce((s,it) => s + (it.price||0) * it.qty, 0);
  const tot = payable(sub);
  const now = new Date();
  const stamp = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ` +
                `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  eposSend(billXml(table, items, sub, tot, stamp))
    .catch(err => {
      console.error('伝票の印刷に失敗', err);
      showStamp('×', 'プリンターに繋がりません');
      browserBill(table, items, sub, tot, stamp);   // 予備：ブラウザ印刷
    });
}

/* プリンターが使えないときの予備 */
function browserBill(table, items, sub, tot, stamp){
  $('printArea').innerHTML = `<div class="rcpt">
    <h1>お 会 計</h1>
    <div class="meta">卓 ${esc(String(table))}　${stamp}</div>
    <hr>
    <div class="r"><span>小計（税抜）</span><span>${yen(sub)}</span></div>
    <div class="r"><span>消費税 10%</span><span>${yen(tot - sub)}</span></div>
    <div class="r big"><span>合計</span><span>${yen(tot)}</span></div>
    <div class="foot">10円未満切り捨て<br>ありがとうございました</div>
  </div>`;
  window.print();
}

async function undoSettle(ids){
  if (!ONLINE || !ids.length) return;
  if (!await ask('この会計を取り消して、注文を戻します。お客様の画面も注文できる状態に戻ります。')) return;
  try{
    await db.runTransaction(async tx => {
      const refs = ids.map(id => db.collection('orders').doc(id));
      const first = (await tx.get(refs[0])).data() || {};
      const t = String(first.table);
      const tRef = db.collection('tables').doc(t);
      const tv = (await tx.get(tRef)).data() || {};
      if (first.session){
        if (tv.status === 'open' && tv.session !== first.session) throw new Error('BUSY');
        tx.set(tRef, {table:t, status:'open', session:first.session, closedAt:null}, {merge:true});
      }
      refs.forEach(r => tx.set(r, {open:true, done:true}, {merge:true}));
    });
    showStamp('戻', '会計を取り消しました');
  }catch(err){
    console.error('取消に失敗', err);
    showStamp('×', err && err.message === 'BUSY' ? '次のお客様が入店済みのため戻せません' : '取消に失敗しました');
  }
}

async function settleTable(table){
  if (!ONLINE) return;
  const t = String(table);
  if (!await ask(`卓${t} の伝票を印刷し、会計済みにします。お客様の画面は注文できなくなり、履歴も消えます。`)) return;
  const hasItems = openRows.some(o => String(o.table) === t && (o.items || []).length);
  if (hasItems) printBill(t);   // 先に伝票を出してから締める
  try{
    const now = Date.now();
    const snap = await db.collection('orders').where('table','==',t).where('open','==',true).get();
    const batch = db.batch();
    snap.forEach(d => batch.set(d.ref, {open:false, done:true, closedAt:now}, {merge:true}));
    batch.set(db.collection('tables').doc(t), {table:t, status:'closed', closedAt:now}, {merge:true});
    activeCalls.filter(c => String(c.table) === t).forEach(c =>
      batch.set(db.collection('calls').doc(c.id), {done:true, doneAt:now}, {merge:true}));
    await batch.commit();
    showStamp('了', `卓${t} 会計済み`);
  }catch(err){ console.error('会計に失敗', err); showStamp('×', '会計に失敗しました'); }
}

$('kitchenBody').addEventListener('click', e => {
  const b = e.target.closest('[data-done]');
  if (b && ONLINE){ db.collection('orders').doc(b.dataset.done).set({done:true}, {merge:true}); return; }
  const tk = e.target.closest('[data-ticket]');
  if (tk){
    const row = kitchenRows.find(r => r.id === tk.dataset.ticket);
    if (row) printTicket(row);
    return;
  }
  const un = e.target.closest('[data-undo]');
  if (un){ undoSettle(un.dataset.undo.split(',')); return; }
  const st = e.target.closest('[data-settle]');
  if (st) settleTable(st.dataset.settle);
});

if (ONLINE){
  // 在庫と提供終了：全端末で共有
  db.collection('state').doc('stock').onSnapshot(d => {
    const v = d.data() || {};
    stock.clear();
    Object.entries(v.counts || {}).forEach(([k,n]) => stock.set(k, n));
    soldOut.clear();
    (v.soldOut || []).forEach(k => soldOut.add(k));
    update();
  }, err => console.error('在庫の受信に失敗', err));

  // 基本数量
  db.collection('state').doc('stockDefault').onSnapshot(d => {
    const v = (d.data() || {}).counts || {};
    stockDefault.clear();
    Object.entries(v).forEach(([k,n]) => stockDefault.set(k, n));
  }, err => console.error('基本数量の受信に失敗', err));

  // 操作中の卓の注文済み
  watchTable();

  // 各卓の状態（入店中・会計済み）
  db.collection('tables').onSnapshot(snap => {
    tablesState.clear();
    snap.forEach(d => tablesState.set(d.id, d.data()));
    refreshViews();
  }, err => console.error('卓の状態を受信できません', err));

  // 全卓の未会計の注文
  db.collection('orders').where('open','==',true).onSnapshot(snap => {
    openRows = [];
    snap.forEach(d => openRows.push({id:d.id, ...d.data()}));
    refreshViews();
  }, err => console.error('未会計の注文を受信できません', err));

  // ホール用：未提供の注文
  db.collection('orders').orderBy('at','desc').limit(150)
    .onSnapshot(snap => {
      snap.docChanges().forEach(ch => {
        if (ch.type !== 'added') return;
        const v = ch.doc.data();
        const at = v.at || 0;
        if (at > BOOTED) beep(TONE.order);   // 注文：ピピッ
        // 印刷担当は、起動前10分以内の出し損ねも拾う
        if (PRINT_STATION && !v.printed && at > BOOTED - 10 * 60000){
          autoPrint(ch.doc.ref, ticketsOf({id:ch.doc.id, ...v}).map(t => t.xml), '注文票');
        }
      });
      kitchenRows = [];
      snap.forEach(d => kitchenRows.push({id:d.id, ...d.data()}));
      if ($('kitchen').classList.contains('on')) renderKitchen();
    }, err => console.error('注文一覧の受信に失敗', err));

  // 呼び出し（未対応のもの）
  db.collection('calls').where('done','==',false).onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      if (ch.type !== 'added') return;
      const v = ch.doc.data();
      const at = v.at || 0;
      const kind = callKind(v);
      if (at > BOOTED){
        beep(kind === 'bill' ? TONE.bill : TONE.call);
        showStamp(kind === 'bill' ? '計' : '呼', `卓${v.table}：${CALL_LABEL[kind]}`);
      }
      if (PRINT_STATION && !v.printed && at > BOOTED - 3 * 60000){
        autoPrint(ch.doc.ref, callXml({id:ch.doc.id, ...v}), '呼び出し票');
      }
    });
    const since = Date.now() - 12 * 3600e3;   // 古い呼び出しは出さない
    activeCalls = [];
    snap.forEach(d => { const v = d.data(); if ((v.at || 0) > since) activeCalls.push({id:d.id, ...v}); });
    activeCalls.sort((a, b) => (a.at || 0) - (b.at || 0));
    refreshViews();
  }, err => console.error('呼び出しの受信に失敗', err));
} else {
  $('staffMsg').textContent = 'スタッフ用（未接続：この端末だけで動作中）';
}

  closeAll(); renderKitchen();
  $('kitchen').classList.add('on'); $('veil').classList.add('on');
});
$('closeKitchen').addEventListener('click', closeAll);
